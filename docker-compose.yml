services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tho_social_publisher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tho_social_publisher"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      MCP_PATH: /mcp
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      OWNER_ACCESS_PASSWORD: ${OWNER_ACCESS_PASSWORD}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tho_social_publisher
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      THREADS_CLIENT_ID: ${THREADS_CLIENT_ID:-}
      THREADS_CLIENT_SECRET: ${THREADS_CLIENT_SECRET:-}
      THREADS_REDIRECT_URI: ${THREADS_REDIRECT_URI:-}
      DUPLICATE_GUARD_HOURS: ${DUPLICATE_GUARD_HOURS:-24}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
